# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: Agentic AI Workshop
  description: A workshop that introduces agentic AI tools and workflows
  keywords: [AI, agents, LLM, workflows]
  authors: [Henry Schreiner]
  github: https://github.com/henryiii/agentic-ai-workshop
  jupyter: false
  exclude:
    - slides
  toc:
    - file: README.md
    - file: content/00_setup.md
    - file: content/01_intro.md
    - file: content/02_agents_md.md
    - file: content/03_inspection.md
    - file: content/04_reviewing.md
    - file: content/05_issue_triage.md
    - file: content/06_ci_and_bugfixes.md
    - file: content/07_common_tasks.md
    - file: content/08_repetitive_work.md
    - file: content/09_writing_tests.md
    - file: content/10_profiling.md
    - file: content/11_new_features.md
    - file: content/12_refactors.md
    - title: Slides
      url: /slides/intro.html

site:
  template: book-theme
  options:
    logo_text: Agentic AI Workshop
    # Vendored so the build never fetches mystmd.org's default favicon, which
    # fails intermittently in CI (ERR_STREAM_PREMATURE_CLOSE).
    favicon: favicon.ico
